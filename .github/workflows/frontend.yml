name: Expo Frontend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    steps:
      # Checkout repo 
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      # Install dependencies
      - name: Install dependencies
        run: npm install

      # TypeScript check
      - name: TypeScript check
        run: npx tsc --noEmit
        continue-on-error: true  # warn but don't fail CI

      # Lint check
      - name: Run ESLint
        run: npm run lint --if-present
        continue-on-error: true

      # Run tests (Jest/Detox if defined)
      - name: Run tests
        run: npm test --if-present
        continue-on-error: true

      # Validate Expo config
      - name: Validate Expo config
        run: npx expo config --type public
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}