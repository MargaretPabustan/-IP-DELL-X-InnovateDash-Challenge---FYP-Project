<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Follow-ups Done</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: sans-serif; background: #e0e0e0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .phone { width: 280px; min-height: 560px; background: #f0f0f0; border-radius: 40px; border: 6px solid #222; overflow: hidden; display: flex; flex-direction: column; }
  .header { background: #27ae60; color: white; padding: 14px 16px; display: flex; align-items: center; }
  .back { background: none; border: none; color: white; font-size: 20px; cursor: pointer; margin-right: 8px; }
  .header h1 { font-size: 16px; font-weight: 700; flex: 1; text-align: center; margin-right: 20px; }
  .list { flex: 1; padding: 10px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
  .card { background: white; border-radius: 14px; padding: 10px 12px; display: flex; align-items: center; gap: 10px; border: 2px solid transparent; cursor: pointer; }
  .card.selected { border-color: #7e5bef; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; background: #27ae60; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .avatar svg { width: 22px; height: 22px; fill: white; }
  .info { flex: 1; }
  .name { font-size: 13px; font-weight: 700; color: #111; }
  .role { font-size: 11px; color: #555; }
  .time { font-size: 11px; color: #888; }
  .add-row { display: flex; gap: 6px; padding: 8px 10px; background: #e8e8e8; }
  .add-row input { flex: 1; border: 1px solid #ccc; border-radius: 8px; padding: 6px 8px; font-size: 12px; }
  .add-row button { background: #27ae60; color: white; border: none; border-radius: 8px; padding: 6px 12px; font-size: 12px; font-weight: 700; cursor: pointer; }
  .bottom-bar { background: #f0f0f0; border-top: 1px solid #ddd; display: flex; justify-content: space-around; align-items: center; padding: 10px 0; }
  .bot-btn { background: none; border: none; cursor: pointer; }
  .bot-btn svg { width: 26px; height: 26px; fill: none; stroke: #555; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .qr-box { background: white; border: 1px solid #ccc; border-radius: 10px; padding: 6px; }
</style>
</head>
<body>
<div class="phone">
  <div class="header">
    <button class="back">&#8249;</button>
    <h1>Follow-ups done</h1>
  </div>
  <div class="list" id="list"></div>
  <div class="add-row">
    <input id="inp" placeholder="Name, Role - Company" />
    <button onclick="addContact()">Add</button>
  </div>
  <div class="bottom-bar">
    <button class="bot-btn">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
    </button>
    <button class="bot-btn qr-box">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="3" height="3"/><rect x="18" y="14" width="3" height="3"/><rect x="14" y="18" width="3" height="3"/><rect x="18" y="18" width="3" height="3"/></svg>
    </button>
    <button class="bot-btn">
      <svg viewBox="0 0 24 24"><path d="M3 12L12 4l9 8"/><path d="M5 10v9a1 1 0 001 1h4v-5h4v5h4a1 1 0 001-1v-9"/></svg>
    </button>
  </div>
</div>

<script>
const KEY = 'followups_done';
const defaults = [
  { id: 1, name: 'John Tan',    role: 'IT Specialist', company: 'DBS',  time: '10.37 am', selected: true  },
  { id: 2, name: 'Azirah Kim',  role: 'IT Specialist', company: 'OCBC', time: '10.45 am', selected: false },
  { id: 3, name: 'Kim Namjoon', role: 'IT Specialist', company: 'NCS',  time: '10.55 am', selected: false }
];

function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || defaults; } catch(e) { return defaults; }
}
function save(data) { localStorage.setItem(KEY, JSON.stringify(data)); }

let contacts = load();

function nowTime() {
  const d = new Date(); let h = d.getHours(), m = d.getMinutes(), ap = h >= 12 ? 'pm' : 'am';
  h = h % 12 || 12; return `${h}.${String(m).padStart(2,'0')} ${ap}`;
}

function render() {
  const list = document.getElementById('list');
  list.innerHTML = '';
  contacts.forEach(c => {
    const div = document.createElement('div');
    div.className = 'card' + (c.selected ? ' selected' : '');
    div.innerHTML = `
      <div class="avatar"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg></div>
      <div class="info"><div class="name">${c.name}</div><div class="role">${c.role} - ${c.company}</div></div>
      <div class="time">${c.time}</div>`;
    div.onclick = () => {
      contacts = contacts.map(x => x.id === c.id ? {...x, selected: !x.selected} : x);
      save(contacts); render();
    };
    list.appendChild(div);
  });
}

function addContact() {
  const inp = document.getElementById('inp'), val = inp.value.trim();
  if (!val) return;
  let name = val, role = 'IT Specialist', company = 'Unknown';
  const parts = val.split(',');
  if (parts.length >= 2) { name = parts[0].trim(); const sub = parts[1].trim().split('-'); role = sub[0].trim(); company = sub[1] ? sub[1].trim() : 'Unknown'; }
  contacts.push({ id: Date.now(), name, role, company, time: nowTime(), selected: false });
  save(contacts); inp.value = ''; render();
}

render();
</script>
</body>
</html>
