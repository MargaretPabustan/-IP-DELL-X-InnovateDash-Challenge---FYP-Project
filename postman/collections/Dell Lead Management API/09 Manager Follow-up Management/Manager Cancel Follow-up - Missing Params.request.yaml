$kind: http-request
name: Manager Cancel Follow-up - Missing Params
method: POST
url: '{{baseUrl}}/manager/followup/cancel'
order: 310
headers:
  - key: Authorization
    value: 'Bearer {{managerToken}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 400", () => pm.response.to.have.status(400));
      pm.test("Response has success false", () => {
          pm.expect(pm.response.json().success).to.be.false;
      });
      pm.test("Error mentions missing cancellation parameters", () => {
          pm.expect(pm.response.json().message).to.include("Missing cancellation");
      });
      pm.test("Response time is under 3000ms", () => {
          pm.expect(pm.response.responseTime).to.be.below(3000);
      });
