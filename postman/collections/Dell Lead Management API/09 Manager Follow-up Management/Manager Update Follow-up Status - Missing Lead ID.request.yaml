$kind: http-request
name: Manager Update Follow-up Status - Missing Lead ID
method: PUT
url: '{{baseUrl}}/manager/followup/'
order: 210
headers:
  - key: Authorization
    value: 'Bearer {{managerToken}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "followup_status": "done"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 404 (route not matched)", () => {
          pm.expect([400, 404]).to.include(pm.response.code);
      });
      pm.test("Response time is under 3000ms", () => {
          pm.expect(pm.response.responseTime).to.be.below(3000);
      });
