$kind: http-request
name: Manager Get Me
method: GET
url: '{{baseUrl}}/manager/me'
order: 100
headers:
  - key: Authorization
    value: 'Bearer {{managerToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Response has success true", () => {
          pm.expect(pm.response.json().success).to.be.true;
      });
      pm.test("Response has user data", () => {
          const data = pm.response.json().data;
          pm.expect(data).to.have.property("user_id");
          pm.expect(data).to.have.property("full_name");
          pm.expect(data).to.have.property("email");
          pm.expect(data).to.have.property("role");
          pm.expect(data).to.have.property("team_id");
      });
      pm.test("Role is manager or admin", () => {
          const role = pm.response.json().data.role;
          pm.expect(["manager", "admin"]).to.include(role);
      });
      pm.test("No password_hash exposed", () => {
          pm.expect(pm.response.json().data).to.not.have.property("password_hash");
      });
      pm.test("Response time is under 3000ms", () => {
          pm.expect(pm.response.responseTime).to.be.below(3000);
      });
