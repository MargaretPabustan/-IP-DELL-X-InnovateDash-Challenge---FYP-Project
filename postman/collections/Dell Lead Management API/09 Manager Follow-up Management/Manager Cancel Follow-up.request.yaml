$kind: http-request
name: Manager Cancel Follow-up
method: POST
url: '{{baseUrl}}/manager/followup/cancel'
order: 300
headers:
  - key: Authorization
    value: 'Bearer {{managerToken}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "lead_id": "{{createdLeadId}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Response has success true", () => {
          pm.expect(pm.response.json().success).to.be.true;
      });
      pm.test("Cancellation confirmed message", () => {
          pm.expect(pm.response.json().message).to.include("cancelled");
      });
      pm.test("Response has affectedRows", () => {
          pm.expect(pm.response.json()).to.have.property("affectedRows");
      });
      pm.test("Response time is under 3000ms", () => {
          pm.expect(pm.response.responseTime).to.be.below(3000);
      });
