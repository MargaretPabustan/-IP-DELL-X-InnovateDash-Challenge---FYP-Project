$kind: http-request
name: Update Lead
method: PUT
url: '{{baseUrl}}/leads/{{createdLeadId}}'
order: 1400
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Jane Doe Updated",
      "email": "{{testEmail}}",
      "company": "Test Corp",
      "title": "CEO",
      "phone_number": "91234567",
      "customer_intent": "High - Ready for follow-up"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Lead updated successfully", () => {
          const json = pm.response.json();
          pm.expect(json.success).to.be.true;
          pm.expect(json.message).to.equal('Lead updated successfully');
      });
