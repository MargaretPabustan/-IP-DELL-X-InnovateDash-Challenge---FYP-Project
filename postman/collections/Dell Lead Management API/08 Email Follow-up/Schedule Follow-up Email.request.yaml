$kind: http-request
name: Schedule Follow-up Email
method: POST
url: '{{baseUrl}}/send-email'
order: 100
headers:
  - key: Authorization
    value: 'Bearer {{managerToken}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "to": "{{testEmail}}",
      "subject": "Your Dell Technologies Follow-up — AI PCs",
      "text": "Hi, thank you for visiting the Dell booth. We'd love to follow up on your interest in AI PCs.",
      "lead_id": "{{createdLeadId}}",
      "followupDate": "2026-08-01T10:00:00.000Z"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Response has success true", () => {
          pm.expect(pm.response.json().success).to.be.true;
      });
      pm.test("Scheduled confirmation message", () => {
          pm.expect(pm.response.json().message).to.include("scheduled");
      });
      pm.test("Response time is under 3000ms", () => {
          pm.expect(pm.response.responseTime).to.be.below(3000);
      });
