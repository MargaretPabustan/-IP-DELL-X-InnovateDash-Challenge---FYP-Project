$kind: http-request
name: Send Manual Follow-up Email - Already Sent
method: POST
url: '{{baseUrl}}/send-followup/{{createdLeadId}}'
order: 210
headers:
  - key: Authorization
    value: 'Bearer {{managerToken}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "followupDate": "2026-08-01T10:00:00.000Z"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 409 (already sent)", () => pm.response.to.have.status(409));
      pm.test("Response has success false", () => {
          pm.expect(pm.response.json().success).to.be.false;
      });
      pm.test("Error mentions already sent", () => {
          pm.expect(pm.response.json().message).to.include("already been sent");
      });
      pm.test("Response time is under 3000ms", () => {
          pm.expect(pm.response.responseTime).to.be.below(3000);
      });
