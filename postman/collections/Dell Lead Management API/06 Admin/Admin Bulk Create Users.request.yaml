$kind: http-request
name: Admin Bulk Create Users
method: POST
url: '{{baseUrl}}/admin/users/bulk'
order: 250
headers:
  - key: Authorization
    value: 'Bearer {{adminToken}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "users": [
        {
          "full_name": "Bulk Rep One",
          "email": "bulkrep1@boothflow.com",
          "password": "BulkPass123",
          "role": "rep",
          "team_id": 1
        },
        {
          "full_name": "Bulk Rep Two",
          "email": "bulkrep2@boothflow.com",
          "password": "BulkPass123",
          "role": "rep",
          "team_id": 2
        }
      ]
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 201", () => pm.response.to.have.status(201));
      pm.test("Response has success true", () => {
          pm.expect(pm.response.json().success).to.be.true;
      });
      pm.test("Created count is 2", () => {
          pm.expect(pm.response.json().created).to.equal(2);
      });
      pm.test("Failed count is 0", () => {
          pm.expect(pm.response.json().failed).to.equal(0);
      });
      pm.test("Errors array is empty", () => {
          pm.expect(pm.response.json().errors).to.be.an("array").that.is.empty;
      });
      pm.test("Response time is under 5000ms", () => {
          pm.expect(pm.response.responseTime).to.be.below(5000);
      });
      const emails = pm.response.json().created_emails;
      if (emails && emails.length > 0) {
          pm.environment.set("bulkCreatedEmails", JSON.stringify(emails));
          console.log("✅ Bulk created emails saved:", emails);
      }