$kind: http-request
name: Admin Get All Users
method: GET
url: '{{baseUrl}}/admin/users'
order: 100
headers:
  - key: Authorization
    value: 'Bearer {{adminToken}}'
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      const baseUrl = pm.environment.get("baseUrl");
      const adminEmail = pm.environment.get("adminEmail");
      const adminPassword = pm.environment.get("adminPassword");
      
      pm.sendRequest({
          url: baseUrl + "/auth/login",
          method: "POST",
          header: { "Content-Type": "application/json" },
          body: {
              mode: "raw",
              raw: JSON.stringify({ email: adminEmail, password: adminPassword })
          }
      }, function(err, res) {
          const token = res.json().token;
          pm.environment.set("adminToken", token);
      });
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Data is array", () => {
          pm.expect(pm.response.json().data).to.be.an("array");
      });
      pm.test("No password_hash exposed", () => {
          pm.response.json().data.forEach(u => {
              pm.expect(u).to.not.have.property("password_hash");
          });
      });
      pm.test("Response time is under 3000ms", () => {
          pm.expect(pm.response.responseTime).to.be.below(3000);
      });