$kind: http-request
name: Admin Assign Lead Team
method: PUT
url: '{{baseUrl}}/admin/leads/{{createdLeadId}}/assign'
order: 60
headers:
  - key: Authorization
    value: 'Bearer {{adminToken}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "assigned_team_id": 1
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Response has success true", () => {
          pm.expect(pm.response.json().success).to.be.true;
      });
      pm.test("Lead team updated message", () => {
          pm.expect(pm.response.json().message).to.equal("Lead team updated");
      });
      pm.test("Response time is under 3000ms", () => {
          pm.expect(pm.response.responseTime).to.be.below(3000);
      });
