$kind: http-request
name: Get Team - Not Found
method: GET
url: '{{baseUrl}}/teams/99999'
order: 2200
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 404", () => pm.response.to.have.status(404));
      pm.test("Returns not found message", () => {
          const json = pm.response.json();
          pm.expect(json.message).to.equal('Team not found');
      });
