$kind: http-request
name: Delete Team
method: DELETE
url: '{{baseUrl}}/teams/{{createdTeamId}}'
order: 2100
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Team deleted", () => {
          const json = pm.response.json();
          pm.expect(json.message).to.equal('Team deleted');
      });
