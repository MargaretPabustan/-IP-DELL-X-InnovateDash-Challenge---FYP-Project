$kind: http-request
name: Remove Interest from Lead
method: DELETE
url: '{{baseUrl}}/lead_interest_categories/{{createdLeadId}}/1'
order: 1100
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Interest removed", () => {
          const json = pm.response.json();
          pm.expect(json.success).to.be.true;
          pm.expect(json.message).to.equal('Interest removed');
      });
