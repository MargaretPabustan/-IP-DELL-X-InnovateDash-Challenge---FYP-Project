$kind: http-request
name: Add Interest - Missing Fields
method: POST
url: '{{baseUrl}}/lead_interest_categories'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "lead_id": 1
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 400", () => pm.response.to.have.status(400));
      pm.test("Returns validation error", () => {
          const json = pm.response.json();
          pm.expect(json.success).to.be.false;
          pm.expect(json.message).to.include('required');
      });
