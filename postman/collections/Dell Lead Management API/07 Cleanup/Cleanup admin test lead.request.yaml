$kind: http-request
name: Cleanup Admin Test Lead
method: DELETE
url: '{{baseUrl}}/leads/{{adminCreatedLeadId}}'
order: 1520
headers:
  - key: Authorization
    value: 'Bearer {{adminToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Admin lead deleted successfully", () => {
          pm.expect(pm.response.json().success).to.be.true;
      });
      pm.test("Response time is under 3000ms", () => {
          pm.expect(pm.response.responseTime).to.be.below(3000);
      });
      pm.environment.unset("adminCreatedLeadId");
      console.log("✅ Admin test lead cleaned up");