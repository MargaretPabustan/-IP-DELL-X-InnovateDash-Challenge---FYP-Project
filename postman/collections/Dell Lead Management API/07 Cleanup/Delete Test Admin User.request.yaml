$kind: http-request
name: Delete Test Admin User
method: DELETE
url: '{{baseUrl}}/admin/users/{{createdUserId}}'
order: 1510
headers:
  - key: Authorization
    value: 'Bearer {{adminToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("User deleted successfully", () => {
          pm.expect(pm.response.json().message).to.equal("User deleted");
      });
      pm.test("Response time is under 3000ms", () => {
          pm.expect(pm.response.responseTime).to.be.below(3000);
      });
      pm.environment.unset("createdUserId");
      pm.environment.unset("repEmail");
      console.log("✅ Test admin user cleaned up");
