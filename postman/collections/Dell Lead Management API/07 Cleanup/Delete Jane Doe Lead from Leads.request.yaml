$kind: http-request
name: Delete Jane Doe Lead from Leads 
method: DELETE
url: '{{baseUrl}}/leads/{{janeDoeLeadId}}'
order: 1520
headers:
  - key: Authorization
    value: 'Bearer {{authToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Lead deleted successfully", () => {
          const json = pm.response.json();
          pm.expect(json.success).to.be.true;
          pm.expect(json.message).to.equal('Lead deleted successfully');
      });
      pm.test("Response time is under 3000ms", () => {
          pm.expect(pm.response.responseTime).to.be.below(3000);
      });
      pm.environment.unset("janeDoeLeadId");
      pm.environment.unset("testEmail");
      console.log("✅ Jane Doe lead cleaned up");
