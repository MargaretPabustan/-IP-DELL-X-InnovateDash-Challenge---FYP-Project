$kind: http-request
name: Manager Route - Rep Access Denied
method: GET
url: '{{baseUrl}}/manager/dashboard'
order: 700
headers:
  - key: Authorization
    value: 'Bearer {{authToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 403", () => pm.response.to.have.status(403));
      pm.test("Returns Forbidden message", () => {
          pm.expect(pm.response.json().message).to.equal("Forbidden");
      });
      pm.test("Response time is under 3000ms", () => {
          pm.expect(pm.response.responseTime).to.be.below(3000);
      });