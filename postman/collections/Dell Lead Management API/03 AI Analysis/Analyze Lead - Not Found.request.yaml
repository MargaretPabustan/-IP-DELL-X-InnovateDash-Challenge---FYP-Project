$kind: http-request
name: Analyze Lead - Not Found
method: POST
url: '{{baseUrl}}/analyze-lead/99999'
order: 1300
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 404", () => pm.response.to.have.status(404));
      pm.test("Returns not found error", () => {
          const json = pm.response.json();
          pm.expect(json.success).to.be.false;
          pm.expect(json.message).to.equal('Lead not found');
      });
