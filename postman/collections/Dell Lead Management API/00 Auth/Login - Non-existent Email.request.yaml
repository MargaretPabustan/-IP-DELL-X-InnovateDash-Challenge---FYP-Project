$kind: http-request
name: Login - Non-existent Email
method: POST
url: '{{baseUrl}}/auth/login'
order: 300
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "nobody@fake.com",
      "password": "password123"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 401", () => pm.response.to.have.status(401));
      pm.test("Returns invalid credentials message", () => {
          const json = pm.response.json();
          pm.expect(json.message).to.equal("Invalid credentials");
      });
      pm.test("Response time is under 3000ms", () => {
          pm.expect(pm.response.responseTime).to.be.below(3000);
      });
