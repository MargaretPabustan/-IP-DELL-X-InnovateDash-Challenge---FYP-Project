$kind: http-request
name: Get Me
method: GET
url: '{{baseUrl}}/auth/me'
order: 400
headers:
  - key: Authorization
    value: 'Bearer {{authToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Response has id", () => {
          const json = pm.response.json();
          pm.expect(json).to.have.property("id");
      });
      pm.test("Response has role", () => {
          const json = pm.response.json();
          pm.expect(json).to.have.property("role");
          pm.expect(["admin", "manager", "rep"]).to.include(json.role);
      });
      pm.test("Response time is under 3000ms", () => {
          pm.expect(pm.response.responseTime).to.be.below(3000);
      });
