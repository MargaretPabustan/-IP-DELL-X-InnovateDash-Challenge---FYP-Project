$kind: http-request
name: Login - Admin
method: POST
url: '{{baseUrl}}/auth/login'
order: 150
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{adminEmail}}",
      "password": "{{adminPassword}}"
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      console.log("adminEmail:", pm.environment.get("adminEmail"));
      console.log("adminPassword:", pm.environment.get("adminPassword"));
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Response has token", () => {
          const json = pm.response.json();
          pm.expect(json).to.have.property("token");
          pm.environment.set("adminToken", json.token);
          console.log("adminToken saved:", json.token ? "YES" : "NO");
      });
      pm.test("Role is admin", () => {
          pm.expect(pm.response.json().role).to.equal("admin");
      });
      pm.test("Response time is under 3000ms", () => {
          pm.expect(pm.response.responseTime).to.be.below(3000);
      });