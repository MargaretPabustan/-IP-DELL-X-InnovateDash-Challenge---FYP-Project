$kind: http-request
name: Manager Export Leads
method: GET
url: '{{baseUrl}}/manager/export/leads'
order: 500
headers:
  - key: Authorization
    value: 'Bearer {{managerToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Data is array", () => {
          pm.expect(pm.response.json().data).to.be.an("array");
      });
      pm.test("Export fields present", () => {
          const data = pm.response.json().data;
          if (data.length > 0) {
              pm.expect(data[0]).to.have.property("lead_id");
              pm.expect(data[0]).to.have.property("name");
              pm.expect(data[0]).to.have.property("email");
              pm.expect(data[0]).to.have.property("status");
          }
      });
      pm.test("Response time is under 3000ms", () => {
          pm.expect(pm.response.responseTime).to.be.below(3000);
      });