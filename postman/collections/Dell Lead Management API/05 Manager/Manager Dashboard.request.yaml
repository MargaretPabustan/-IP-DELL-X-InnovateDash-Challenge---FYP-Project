$kind: http-request
name: Manager Dashboard
method: GET
url: '{{baseUrl}}/manager/dashboard'
order: 100
headers:
  - key: Authorization
    value: 'Bearer {{managerToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Response has success true", () => {
          pm.expect(pm.response.json().success).to.be.true;
      });
      pm.test("Response has total_leads", () => {
          pm.expect(pm.response.json().data).to.have.property("total_leads");
      });
      pm.test("Response has qualified count", () => {
          pm.expect(pm.response.json().data).to.have.property("qualified");
      });
      pm.test("Response has contacted count", () => {
          pm.expect(pm.response.json().data).to.have.property("contacted");
      });
      pm.test("Response has new_leads count", () => {
          pm.expect(pm.response.json().data).to.have.property("new_leads");
      });
      pm.test("Response time is under 3000ms", () => {
          pm.expect(pm.response.responseTime).to.be.below(3000);
      });