$kind: http-request
name: Export Leads Excel
method: GET
url: '{{baseUrl}}/export/leads/excel'
order: 550
headers:
  - key: Authorization
    value: 'Bearer {{managerToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Content-Type is Excel", () => {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("spreadsheetml.sheet");
      });
      pm.test("Content-Disposition has filename", () => {
          pm.expect(pm.response.headers.get("Content-Disposition")).to.include("leads.xlsx");
      });
      pm.test("Response time is under 5000ms", () => {
          pm.expect(pm.response.responseTime).to.be.below(5000);
      });