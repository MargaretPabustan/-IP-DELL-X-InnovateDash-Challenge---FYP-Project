$kind: http-request
name: Send Follow-up Email
method: POST
url: '{{baseUrl}}/send-followup/{{createdLeadId}}'
order: 560
headers:
  - key: Authorization
    value: 'Bearer {{managerToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Success true", () => {
          pm.expect(pm.response.json().success).to.be.true;
      });
      pm.test("Follow-up scheduled message", () => {
          pm.expect(pm.response.json().message).to.equal("Follow-up scheduled for 24h later");
      });
      pm.test("Response time is under 3000ms", () => {
          pm.expect(pm.response.responseTime).to.be.below(3000);
      });