$kind: http-request
name: Get All Teams
method: GET
url: '{{baseUrl}}/teams'
order: 1700
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Response is an array", () => {
          pm.expect(pm.response.json()).to.be.an('array');
      });
