$kind: http-request
name: Admin Update User Permissions
method: PUT
url: '{{baseUrl}}/admin/users/{{createdUserId}}/permissions'
order: 400
headers:
  - key: Authorization
    value: 'Bearer {{adminToken}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "permissions": {
        "can_export": true,
        "can_delete_leads": false
      }
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Returns permissions updated message", () => {
          pm.expect(pm.response.json().message).to.equal("Permissions updated");
      });
      pm.test("Response has permissions data", () => {
          pm.expect(pm.response.json().data).to.have.property("permissions");
      });
      pm.test("Response time is under 3000ms", () => {
          pm.expect(pm.response.responseTime).to.be.below(3000);
      });
