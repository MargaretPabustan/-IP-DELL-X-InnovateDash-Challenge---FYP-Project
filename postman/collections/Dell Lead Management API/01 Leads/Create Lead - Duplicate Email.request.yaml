$kind: http-request
name: Create Lead - Duplicate Email
method: POST
url: '{{baseUrl}}/leads'
order: 600
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Jane Doe",
      "email": "{{testEmail}}",
      "company": "Test Corp",
      "title": "CTO",
      "phone_number": "91234567",
      "customer_intent": "High - Ready for follow-up"
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      const email = pm.environment.get("testEmail");
      console.log("testEmail value:", email);
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 409", () => pm.response.to.have.status(409));
      pm.test("Returns duplicate email error", () => {
          const json = pm.response.json();
          pm.expect(json.success).to.be.false;
          pm.expect(json.code).to.equal('DUPLICATE_EMAIL');
      });
