$kind: http-request
name: Create Lead
method: POST
url: '{{baseUrl}}/leads'
order: 100
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Jane Doe",
      "email": "{{testEmail}}",
      "company": "Test Corp",
      "title": "CTO",
      "phone_number": "91234567",
      "customer_intent": "High - Ready for follow-up"
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      const timestamp = Date.now();
      const email = `testlead.${timestamp}@testcompany.com`;
      pm.environment.set("testEmail", email);
      console.log("testEmail set to:", email);
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 201", () => pm.response.to.have.status(201));
      pm.test("Response has success true", () => {
          const json = pm.response.json();
          pm.expect(json.success).to.be.true;
          pm.expect(json.message).to.equal('Lead created successfully');
      });
      pm.test("Response contains lead_id", () => {
          const json = pm.response.json();
          pm.expect(Number(json.lead_id)).to.be.a('number');
          pm.environment.set("createdLeadId", String(json.lead_id));
          console.log("createdLeadId set to:", json.lead_id);
      });
