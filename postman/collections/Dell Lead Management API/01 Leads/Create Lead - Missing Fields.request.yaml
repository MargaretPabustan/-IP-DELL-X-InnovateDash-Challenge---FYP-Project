$kind: http-request
name: Create Lead - Missing Fields
method: POST
url: '{{baseUrl}}/leads'
order: 400
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{authToken}}'
body:
  type: json
  content: |-
    {
      "name": "Jane Doe",
      "email": "jane@test.com"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 400", () => pm.response.to.have.status(400));
      pm.test("Returns validation error", () => {
          const json = pm.response.json();
          pm.expect(json.success).to.be.false;
          pm.expect(json.message).to.include('required');
      });