apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: dell-backend
  namespace: boothflow

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dell-backend

  minReplicas: 1
  maxReplicas: 5

  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50